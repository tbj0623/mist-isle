<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="t">
  <title id="t">雾岛突围 MIST ISLE</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b2324"/>
      <stop offset=".55" stop-color="#071719"/>
      <stop offset="1" stop-color="#030b0c"/>
    </linearGradient>
    <radialGradient id="glow" cx=".52" cy=".58" r=".52">
      <stop offset="0" stop-color="#6fe0c8" stop-opacity=".38"/>
      <stop offset=".55" stop-color="#26a58d" stop-opacity=".13"/>
      <stop offset="1" stop-color="#26a58d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#123c3c" stop-opacity=".9"/>
      <stop offset="1" stop-color="#061617" stop-opacity=".2"/>
    </linearGradient>
    <linearGradient id="isle" x1=".2" y1=".1" x2=".8" y2=".95">
      <stop offset="0" stop-color="#2f8f7d"/>
      <stop offset=".5" stop-color="#1b5f57"/>
      <stop offset="1" stop-color="#0d3233"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6fe0c8" stop-opacity="0"/>
      <stop offset=".5" stop-color="#97ecd9" stop-opacity=".95"/>
      <stop offset="1" stop-color="#6fe0c8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe0a1"/>
      <stop offset=".5" stop-color="#f5b445"/>
      <stop offset="1" stop-color="#c98a26"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6fe0c8" stop-opacity="0"/>
      <stop offset=".5" stop-color="#6fe0c8" stop-opacity=".16"/>
      <stop offset="1" stop-color="#6fe0c8" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <clipPath id="card">
      <rect x="16" y="16" width="480" height="480" rx="112"/>
    </clipPath>
  </defs>

  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg)"/>
  <g clip-path="url(#card)">
    <!-- 战术网格 -->
    <g stroke="#6fe0c8" stroke-opacity=".07" stroke-width="1.4">
      <path d="M16 112h480M16 200h480M16 288h480M16 376h480M16 464h480"/>
      <path d="M112 16v480M200 16v480M288 16v480M376 16v480M464 16v480"/>
    </g>
    <!-- 海雾辉光 -->
    <circle cx="266" cy="300" r="210" fill="url(#glow)"/>
    <!-- 海面 -->
    <path d="M16 352c72-16 128 10 196-2s120-26 184-8 84 6 116-2v186H16Z" fill="url(#sea)"/>
    <!-- 信号风暴：同心弧 -->
    <g fill="none" stroke="#6fe0c8" stroke-linecap="round">
      <path d="M330 176a96 96 0 0 1 96 96" stroke-opacity=".85" stroke-width="7"/>
      <path d="M312 146a132 132 0 0 1 132-132" stroke-opacity=".45" stroke-width="6" transform="translate(0 40)"/>
      <path d="M348 208a64 64 0 0 1 62 62" stroke="#c3f6ea" stroke-opacity=".9" stroke-width="5"/>
      <path d="M124 372a92 92 0 0 0 92 92" stroke="#97ecd9" stroke-opacity=".35" stroke-width="5"/>
    </g>
    <!-- 岛屿本体 -->
    <path d="M150 268c14-30 46-46 86-52 42-6 78-30 116-24 38 6 56 34 50 66-6 32-34 46-62 58-30 13-58 34-94 36-40 2-76-12-90-38-8-16-10-32-6-46Z" fill="url(#isle)"/>
    <path d="M150 268c14-30 46-46 86-52 42-6 78-30 116-24 38 6 56 34 50 66-6 32-34 46-62 58-30 13-58 34-94 36-40 2-76-12-90-38-8-16-10-32-6-46Z" fill="none" stroke="#6fe0c8" stroke-opacity=".55" stroke-width="3"/>
    <!-- 岛内等高线 -->
    <g fill="none" stroke="#97ecd9" stroke-opacity=".28" stroke-width="2">
      <path d="M186 276c12-20 38-30 66-34 30-4 56-18 84-14 26 4 38 22 34 42"/>
      <path d="M214 300c10-14 30-20 52-24 24-4 44-14 64-10"/>
    </g>
    <!-- 海岸微光 -->
    <path d="M150 268c14-30 46-46 86-52 42-6 78-30 116-24 38 6 56 34 50 66-6 32-34 46-62 58-30 13-58 34-94 36-40 2-76-12-90-38-8-16-10-32-6-46Z" fill="#6fe0c8" fill-opacity=".16" filter="url(#soft)"/>
    <!-- 扫描线 -->
    <rect x="16" y="16" width="480" height="480" fill="url(#scan)"/>
    <!-- 瞄准准星 -->
    <g stroke="url(#amber)" stroke-linecap="round" stroke-width="9" fill="none">
      <path d="M256 108v42M256 362v42M108 256h42M362 256h42"/>
    </g>
    <circle cx="256" cy="256" r="98" fill="none" stroke="#f5b445" stroke-opacity=".34" stroke-width="4" stroke-dasharray="10 22"/>
    <circle cx="256" cy="256" r="13" fill="none" stroke="#f5b445" stroke-width="5"/>
    <circle cx="256" cy="256" r="4.5" fill="#97ecd9"/>
    <!-- 方位刻点 -->
    <g fill="#ffe0a1">
      <circle cx="256" cy="96" r="4" fill-opacity=".5"/>
      <circle cx="416" cy="256" r="4" fill-opacity=".5"/>
      <circle cx="96" cy="256" r="4" fill-opacity=".5"/>
      <circle cx="256" cy="416" r="4" fill-opacity=".5"/>
    </g>
  </g>

  <!-- 内描边 -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="url(#rim)" stroke-opacity=".5" stroke-width="2.5"/>
  <rect x="27" y="27" width="458" height="458" rx="102" fill="none" stroke="#6fe0c8" stroke-opacity=".14" stroke-width="1.5"/>
</svg>
