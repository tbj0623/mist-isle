<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#0d1a1d">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="format-detection" content="telephone=no">
  <title>雾岛突围 · MIST ISLE</title>
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./style.css">
  <script src="./app.js" defer></script>
</head>
<body>
  <canvas id="world" aria-label="雾岛游戏场景"></canvas>
  <div id="boot">
    <div class="boot-mark"><img src="./icon.svg" alt=""></div>
    <div class="boot-title">MIST ISLE<small>雾岛突围</small></div>
    <div class="boot-bar"><i></i></div>
    <p class="boot-hint">正在连接雾岛战区…</p>
  </div>
  <div id="screen-root"></div>
  <div id="hud" class="hidden"></div>
  <div id="dialog-root"></div>
  <div id="fx-overlay"></div>
  <div id="toast-root" role="status" aria-live="polite"></div>
  <div id="rotate-hint"><span>↻</span>横屏游玩，视野更开阔</div>
</body>
</html>
